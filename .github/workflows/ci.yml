# =============================================================================
# aocs-compliance-svc — CI (Lint, Build, Test)
# =============================================================================
# Ring 3 PAID service — ZKP, DLP, evidence vault, SOC2/EU AI Act reports.
# Depends on ocx-shared-go (replace directive in go.mod).
#
# Jobs:
#   lint-build  — go vet + go build (every push + PR)
#   (unit tests: see unit-tests.yml)
#   trivy       — container CVE scan (main branch only)
# =============================================================================
name: CI — aocs-compliance-svc

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.23'
  SERVICE: aocs-compliance

defaults:
  run:
    working-directory: aocs-compliance-svc

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aocs-compliance-svc

      - name: Checkout ocx-shared-go
        uses: actions/checkout@v4
        with:
          repository: Generativebots/ocx-shared-go
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: ocx-shared-go

      - uses: actions/setup-go@v5
        with:
          go-version-file: aocs-compliance-svc/go.mod
          cache: true
          cache-dependency-path: aocs-compliance-svc/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build (all packages)
        run: go build ./...

      - name: Build service binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null ./cmd/aocs-compliance/...
          echo "✅ aocs-compliance binary builds clean"

  # Unit tests (go vet + go test -race) run in unit-tests.yml.

  trivy:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    needs: [lint-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          path: aocs-compliance-svc

      - name: Checkout ocx-shared-go
        uses: actions/checkout@v4
        with:
          repository: Generativebots/ocx-shared-go
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: ocx-shared-go

      - name: Build image for scan
        run: |
          cd "$GITHUB_WORKSPACE"
          docker build \
            -f aocs-compliance-svc/Dockerfile \
            -t aocs-compliance:scan \
            --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 \
            .

      - name: Trivy image scan (HIGH + CRITICAL — fail on unfixed)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: aocs-compliance:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
