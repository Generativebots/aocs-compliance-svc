# =============================================================================
# docker-compose.yml — aocs-compliance-svc
# =============================================================================
# Service dependencies:
#   REQUIRES Foundation (aocs-system-svc :8082) — for tenant validation + billing
#   REQUIRES Core (ocx-core-svc :8083/:8085) — for agent/HITL/enforcement data
#   Start AFTER: docker compose up -d in aocs-system-svc AND ocx-core-svc
#
# Usage:
#   docker compose up -d        → start compliance service (:8089)
#   docker compose logs -f      → tail logs
#   docker compose down         → stop
# =============================================================================

x-common-env: &common-env
  OCX_SERVICE_NAME: aocs-compliance   # shows in Supabase logs + pg_stat_activity
  OCX_ENV: ${OCX_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:

  # ── aocs-compliance ──────────────────────────────────────────────────────────
  aocs-compliance:
    build:
      context: ..
      dockerfile: aocs-compliance-svc/Dockerfile
    container_name: ocx-aocs-compliance-local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      <<: *common-env
      PORT: "8089"
      SERVICE_NAME: "aocs-compliance"
      FACTORY_ROUTES_DISABLED: "true"

      # ── Supabase ──────────────────────────────────────────────────────────
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # ── Database (compliance schema) ──────────────────────────────────────
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-6543}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_SCHEMA: "public"

      # ── Foundation: aocs-system-svc ───────────────────────────────────────
      # Container-to-container URLs use service names on aocs-system-net.
      # They are deliberately NOT interpolated from .env: .env holds the
      # host-run values (http://localhost:...), which are unreachable here.
      INTERNAL_API_URL: http://aocs-system:8082

      # ── Core: ocx-core-svc ───────────────────────────────────────────────
      # Compliance needs Core to read agent executions, HITL decisions,
      # enforcement actions. Without Core, report handlers return 503.
      CORE_INTERNAL_API_URL: http://aocs-gate:8080
      HUB_INTERNAL_API_URL: http://aocs-hub:8080

      # ── Security ──────────────────────────────────────────────────────────
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY:-}

      # Shared Redis: session revocations / role changes issued by system.
      OCX_REDIS_ENABLED: "true"
      OCX_REDIS_ADDR: ${OCX_REDIS_ADDR:-redis:6379}

      # ── GCP Pub/Sub — shared local emulator (aocs-system-svc compose) ─────
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-local-dev}
      PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST:-pubsub:8681}
      SYSTEM_EVENTS_TRANSPORT: ${SYSTEM_EVENTS_TRANSPORT:-}
      LEDGER_PUBSUB_TOPIC: ${LEDGER_PUBSUB_TOPIC:-aocs-compliance-ledger}

      # ── Feature control ───────────────────────────────────────────────────
      ZKP_ENABLED: ${ZKP_ENABLED:-true}
      DLP_ENABLED: ${DLP_ENABLED:-true}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aocs-net
    labels:
      com.aocs.tier: "compliance"
      com.aocs.service: "compliance"
      com.aocs.description: "ZKP, DLP, compliance cases, evidence vault, SOC2/EU AI Act reports"

networks:
  aocs-net:
    external: true
    name: aocs-system-net
